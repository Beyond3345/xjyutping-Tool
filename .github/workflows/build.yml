# Builds the installers for Windows (NSIS) and macOS (universal .dmg).
# A pushed tag v<version> creates a draft release with the notes of that version
# from CHANGELOG.md; both jobs build, check and attach their installer, and the
# release is published once both have passed. Started by hand, the workflow
# only builds and keeps the installers as workflow artifacts.
# The xjyutping packages are checked out next to this repository, as in the
# workspace; update the two commits below when a new release of them is wanted.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  XJYUTPING_PY_COMMIT: 88c6e9939b805297cb8b8b64aa582bd8a3946d9b   # xjyutping-py 1.3.1
  XJYUTPING_TEX_COMMIT: f93752326354be9add30d3091f57df1a7aef626e  # xjyutping-tex 1.5.1

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.result }}
    steps:
      - uses: actions/checkout@v7
      - id: draft
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const version = context.ref.replace('refs/tags/v', '')
            // the entry of this version in Part I of CHANGELOG.md
            const log = fs.readFileSync('CHANGELOG.md', 'utf8')
            const at = log.indexOf(`## [${version}]`)
            let notes = ''
            if (at >= 0) {
              const rest = log.slice(log.indexOf('\n', at) + 1)
              const end = rest.search(/\n(## \[|---|# )/)
              notes = (end < 0 ? rest : rest.slice(0, end)).trim()
            }
            const body = `${notes}\n\n### Installing\n\n`
              + `- macOS 13.3 or later (Apple Silicon and Intel): open \`xjyutping-Tool_${version}_universal.dmg\`, drag the app into Applications, open it once and allow it in System Settings, Privacy & Security, "Open anyway" (the app is not signed with an Apple Developer ID).\n`
              + `- Windows 10 or 11: run \`xjyutping-Tool_${version}_x64-setup.exe\`; if SmartScreen warns about an unknown publisher, choose "More info", then "Run anyway".\n\n`
              + 'Neither needs Python or TeX on the computer. See the README for how to use the tool.'
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              tag_name: `v${version}`, name: `xjyutping-Tool ${version}`, body, draft: true })
            return data.id

  build:
    needs: release
    # also runs when started by hand, when there is no release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      # keep LF endings in the checkouts, which the bash script needs
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          path: xjyutping-Tool
      - uses: actions/checkout@v7
        with:
          repository: Beyond3345/xjyutping-py
          ref: ${{ env.XJYUTPING_PY_COMMIT }}
          path: xjyutping-py
      - uses: actions/checkout@v7
        with:
          repository: Beyond3345/xjyutping-tex
          ref: ${{ env.XJYUTPING_TEX_COMMIT }}
          path: xjyutping-tex
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: xjyutping-Tool/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: xjyutping-Tool/src-tauri
      # Tectonic and the fonts (about 210 MB), pinned by sha256 in vendor.mjs
      - uses: actions/cache@v6
        with:
          path: xjyutping-Tool/.downloads
          key: downloads-${{ runner.os }}-${{ hashFiles('xjyutping-Tool/scripts/vendor.mjs') }}
      - run: npm ci
        working-directory: xjyutping-Tool
      - run: node scripts/vendor.mjs
        working-directory: xjyutping-Tool
      # the bundled engine and TeX files compile the fixture lesson on this system
      - run: scripts/compile-check.sh --engine-only
        shell: bash
        working-directory: xjyutping-Tool
        env:
          PYTHON: python
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: xjyutping-Tool
          releaseId: ${{ needs.release.outputs.id }}
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
      # the built app loads Python, reads a sample with corrections and compiles
      # it with the bundled engine, then writes a report (see src-tauri/src/main.rs)
      - name: Self-test the built app (Windows)
        if: runner.os == 'Windows'
        working-directory: xjyutping-Tool/src-tauri/target/release
        shell: pwsh
        timeout-minutes: 5
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'self-test.txt'
          $app = Start-Process -FilePath .\xjyutping-Tool.exe -ArgumentList '--self-test', $report -PassThru -Wait
          Get-Content $report
          exit $app.ExitCode
      - name: Self-test the built app (macOS)
        if: runner.os == 'macOS'
        working-directory: xjyutping-Tool/src-tauri/target/universal-apple-darwin/release/bundle/macos
        timeout-minutes: 5
        run: |
          set +e
          xjyutping-Tool.app/Contents/MacOS/xjyutping-Tool --self-test "$RUNNER_TEMP/self-test.txt"
          status=$?
          cat "$RUNNER_TEMP/self-test.txt"
          exit $status

  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number('${{ needs.release.outputs.id }}'), draft: false })
